name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Python tests
        run: python -m pytest -v

  wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run simulated wallet tests
        run: node tests/test_scoreboard_wallet.cjs

  blockchain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.2.3
      - name: Install integration dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --global ganache@7.9.2
      - name: Compile and test Solidity contracts
        run: forge test --root contracts -vv
      - name: Test Flask integration with disposable Ganache
        shell: bash
        run: |
          set -euo pipefail
          ganache --server.host 127.0.0.1 --server.port 18545 --chain.chainId 1337 --logging.quiet > "$RUNNER_TEMP/ganache.log" 2>&1 &
          ganache_pid=$!
          trap 'kill "$ganache_pid" 2>/dev/null || true; wait "$ganache_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          from web3 import Web3

          rpc = Web3(Web3.HTTPProvider(
              'http://127.0.0.1:18545', request_kwargs={'timeout': 1},
              exception_retry_configuration=None))
          for attempt in range(30):
              try:
                  if rpc.eth.chain_id == 1337:
                      break
              except Exception:
                  pass
              time.sleep(1)
          else:
              raise SystemExit('Ganache did not become ready on port 18545 with Chain ID 1337.')
          PY
          kill -0 "$ganache_pid"
          python scripts/check_scoreboard.py --rpc-url http://127.0.0.1:18545 --chain-id 1337
