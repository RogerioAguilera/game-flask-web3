<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Adivinhador</title>
    <style>
        :root {
            --purple-dark: #050810;
            --purple-mid:  #0891b2;
            --purple-light:#00f0ff;
            --accent:      #ff2ec4;
            --gold:        #eaff00;
            --text:        #d6faff;
            --muted:       #5b8aa0;
            --yes-color:   #00ff9c;
            --no-color:    #ff2965;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at top, #001c2e 0%, #000005 65%);
            font-family: 'Segoe UI', Arial, sans-serif;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* grid + stars */
        body::before {
            content: '';
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background-image:
                linear-gradient(rgba(0,240,255,.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,240,255,.05) 1px, transparent 1px),
                radial-gradient(1px 1px at 15% 20%, #fff, transparent),
                radial-gradient(1px 1px at 35% 10%, #fff, transparent),
                radial-gradient(1px 1px at 65% 18%, #fff, transparent),
                radial-gradient(1px 1px at 85% 35%, #fff, transparent),
                radial-gradient(1px 1px at 10% 60%, #fff, transparent),
                radial-gradient(1px 1px at 50% 75%, #fff, transparent),
                radial-gradient(1px 1px at 78% 80%, #fff, transparent),
                radial-gradient(1px 1px at 25% 88%, #fff, transparent),
                radial-gradient(1px 1px at 92% 55%, #fff, transparent),
                radial-gradient(2px 2px at 42% 42%, rgba(255,46,196,.5), transparent),
                radial-gradient(2px 2px at 72% 12%, rgba(0,240,255,.5), transparent),
                radial-gradient(2px 2px at 18% 45%, rgba(234,255,0,.4), transparent);
            background-size: 42px 42px, 42px 42px, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto;
        }

        /* ── Layout ── */
        header {
            position: relative; z-index: 1;
            text-align: center; padding: 28px 16px 0;
        }
        header img {
            width: 80px;
            filter: drop-shadow(0 0 18px var(--accent));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }
        header h1 {
            font-family: 'Orbitron', 'Segoe UI', Arial, sans-serif;
            font-size: 1.9rem; font-weight: 800; margin-top: 10px; letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--purple-light), var(--gold), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        header p { font-family: 'Share Tech Mono', monospace; font-size: .85rem; color: var(--muted); margin-top: 4px; }

        main {
            position: relative; z-index: 1;
            width: 100%; max-width: 500px;
            padding: 20px 14px 48px;
            display: flex; flex-direction: column; gap: 20px;
        }

        /* ── Score bar ── */
        #scorebar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 16px;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(0,240,255,.25);
            border-radius: 12px;
            font-family: 'Share Tech Mono', monospace;
            font-size: .85rem; color: var(--muted);
        }
        #scorebar span { color: var(--gold); font-weight: 700; font-size: 1rem; }
        .score-right { display: flex; gap: 16px; }
        .kbd { display: inline-block; padding: 1px 6px; border: 1px solid rgba(255,255,255,.2); border-radius: 4px; font-size: .7rem; color: #888; }

        /* ── Card ── */
        .card {
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(0,240,255,.3);
            border-radius: 20px; padding: 24px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 24px rgba(0,240,255,.08), inset 0 0 40px rgba(255,46,196,.03);
        }

        /* ── Game card ── */
        #gameCard {
            min-height: 320px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; gap: 0;
        }

        /* ── States ── */
        .state { display: none; flex-direction: column; align-items: center; gap: 18px; width: 100%; }
        .state.active { display: flex; }

        /* idle */
        #idleState p { color: var(--muted); font-size: .95rem; max-width: 280px; line-height: 1.5; }

        /* question */
        .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; }
        .progress-fill { height: 100%; width: 5%; background: linear-gradient(90deg, var(--purple-light), var(--accent)); border-radius: 99px; transition: width .5s ease; }
        .step-label { font-family: 'Share Tech Mono', monospace; font-size: .75rem; color: #2e7a8c; align-self: flex-end; }
        #questionText {
            font-size: 1.2rem; font-weight: 600; color: #b8f4ff;
            line-height: 1.5; min-height: 58px;
            transition: opacity .25s;
        }
        #questionText.dim { opacity: 0; }
        .answer-btns { display: flex; gap: 14px; width: 100%; justify-content: center; }

        /* guess */
        .guess-emoji { font-size: 3.8rem; animation: pop .5s cubic-bezier(.34,1.56,.64,1) both; }
        @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .guess-label { font-size: .85rem; color: var(--muted); }
        .guess-name {
            font-size: 2rem; font-weight: 900;
            background: linear-gradient(90deg, var(--gold), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            animation: pop .5s .15s cubic-bezier(.34,1.56,.64,1) both;
        }
        .feedback-row { display: flex; gap: 10px; }
        #feedbackMsg { font-size: 1rem; font-weight: 600; min-height: 24px; animation: fadeIn .3s; }
        .feedback-yes { color: var(--yes-color); }
        .feedback-no  { color: var(--no-color); }

        /* ── Buttons ── */
        .btn {
            border: none; border-radius: 12px; padding: 11px 26px;
            font-size: .95rem; font-weight: 700; cursor: pointer;
            transition: transform .12s, box-shadow .12s; outline: none;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn:active { transform: scale(.95) !important; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }

        .btn-primary {
            background: linear-gradient(135deg, var(--purple-mid), var(--purple-light));
            color: #002830; box-shadow: 0 4px 20px rgba(0,240,255,.4);
        }
        .btn-primary:not(:disabled):hover { box-shadow: 0 6px 28px rgba(0,240,255,.7); transform: translateY(-2px); }

        .btn-yes {
            flex: 1; max-width: 160px;
            background: linear-gradient(135deg, #007a5c, var(--yes-color));
            color: #002014; box-shadow: 0 4px 16px rgba(0,255,156,.3);
            font-size: 1.05rem;
        }
        .btn-yes:not(:disabled):hover { box-shadow: 0 6px 24px rgba(0,255,156,.5); transform: translateY(-2px); }

        .btn-no {
            flex: 1; max-width: 160px;
            background: linear-gradient(135deg, #7a0030, var(--no-color));
            color: #fff; box-shadow: 0 4px 16px rgba(255,41,101,.3);
            font-size: 1.05rem;
        }
        .btn-no:not(:disabled):hover { box-shadow: 0 6px 24px rgba(255,41,101,.5); transform: translateY(-2px); }

        .btn-correct {
            background: linear-gradient(135deg, #007a5c, var(--yes-color));
            color: #002014; box-shadow: 0 4px 12px rgba(0,255,156,.3);
        }
        .btn-wrong {
            background: transparent; color: var(--no-color);
            border: 1.5px solid var(--no-color);
        }
        .btn-wrong:hover { background: rgba(239,68,68,.1); }

        .btn-ghost {
            background: transparent; color: var(--muted);
            border: 1px solid rgba(255,255,255,.15);
            font-size: .85rem; padding: 8px 18px;
        }
        .btn-ghost:hover { border-color: var(--muted); color: var(--text); }

        /* ── History panel ── */
        #historyPanel {
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(0,240,255,.2);
            border-radius: 14px; padding: 14px 18px;
            display: none;
        }
        #historyPanel summary {
            cursor: pointer; color: var(--muted); font-size: .85rem;
            font-weight: 600; list-style: none; user-select: none;
            display: flex; align-items: center; gap: 6px;
        }
        #historyPanel summary::-webkit-details-marker { display: none; }
        #historyPanel[open] summary::before { content: '▾'; }
        #historyPanel:not([open]) summary::before { content: '▸'; }

        #historyList { list-style: none; padding: 12px 0 0; display: flex; flex-direction: column; gap: 6px; }
        #historyList li {
            display: flex; justify-content: space-between; align-items: center;
            font-size: .82rem; color: #6fa8bc; padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,.05);
        }
        #historyList li:last-child { border-bottom: none; }
        #historyList li.hist-guess { color: var(--gold); font-weight: 700; justify-content: center; }
        .hist-badge {
            padding: 2px 8px; border-radius: 6px; font-size: .75rem; font-weight: 700;
        }
        .hist-yes { background: rgba(0,255,156,.2); color: #5cffbf; }
        .hist-no  { background: rgba(255,41,101,.2);  color: #ff7096; }

        /* ── ETH card ── */
        #ethCard h2 { font-size: .95rem; font-weight: 600; color: var(--muted); margin-bottom: 12px; }
        .eth-row { display: flex; gap: 8px; }
        .eth-input {
            flex: 1; background: rgba(255,255,255,.06);
            border: 1px solid rgba(0,240,255,.35); border-radius: 10px;
            padding: 9px 13px; color: var(--text); font-size: .82rem; outline: none;
            transition: border-color .2s;
        }
        .eth-input::placeholder { color: #3d6270; }
        .eth-input:focus { border-color: var(--purple-light); }
        .btn-eth {
            background: linear-gradient(135deg, #7a0e9c, var(--accent));
            color: #fff; border-radius: 10px; padding: 9px 14px;
            font-size: .82rem; font-weight: 700; white-space: nowrap;
        }
        .btn-eth:hover { box-shadow: 0 4px 16px rgba(255,46,196,.4); transform: translateY(-1px); }
        #ethResult { margin-top: 10px; font-size: .85rem; min-height: 20px; color: var(--muted); }
        #ethResult.ok  { color: #5cffbf; }
        #ethResult.err { color: #ff7096; }

        /* ── Crystal ball (idle) ── */
        .crystal { font-size: 3.5rem; filter: drop-shadow(0 0 14px var(--accent)); animation: glow 2s ease-in-out infinite; }
        @keyframes glow {
            0%,100% { filter: drop-shadow(0 0 14px var(--accent)); }
            50%      { filter: drop-shadow(0 0 28px var(--gold)); }
        }

        /* ── Thinking dots ── */
        .thinking { display: inline-flex; gap: 5px; }
        .thinking span {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--purple-light);
            animation: blink 1.2s infinite;
        }
        .thinking span:nth-child(2) { animation-delay: .2s; }
        .thinking span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }

        /* ── Confetti ── */
        .confetti-piece {
            position: fixed; top: -20px; z-index: 9999; pointer-events: none;
            border-radius: 2px;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* ── Utils ── */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='game.css') }}">
</head>
<body>

<header class="site-header">
    <a class="brand" href="/">Web3 Adivinhador <span class="brand-gem" aria-hidden="true">◈</span></a>
    <details class="site-menu"><summary aria-label="Abrir menu">☰</summary><nav><a href="#ethCard">Consultar saldo</a><button onclick="startGame()">Nova partida</button></nav></details>
</header>
<main>
    <!-- ── Jogo ── -->
    <div class="card" id="gameCard">
        <div class="wizard" role="img" aria-label="Gênio holográfico"></div>

        <!-- Idle -->
        <div class="state active" id="idleState">
            <h2>Em quem você está pensando?</h2>
            <p>Pense em um personagem famoso — real ou fictício — e eu tentarei adivinhar quem é!</p>
            <button class="btn btn-primary" onclick="startGame()">✨ Iniciar Jogo</button>
        </div>

        <!-- Question -->
        <div class="state" id="questionState">
            <span class="step-label" id="stepLabel">Pergunta 1</span>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <p id="questionText"></p>
            <div class="answer-btns">
                <button class="btn btn-yes" id="btnYes" onclick="sendAnswer('yes')">Sim <kbd class="kbd" style="font-size:.65rem;opacity:.6">S</kbd></button>
                <button class="btn btn-no"  id="btnNo"  onclick="sendAnswer('no')">Não <kbd class="kbd" style="font-size:.65rem;opacity:.6">N</kbd></button>
            </div>
        </div>

        <!-- Guess -->
        <div class="state" id="guessState">
            <div class="guess-emoji" id="guessEmoji">🔮</div>
            <p class="guess-label">O gênio revela...</p>
            <div class="guess-name" id="guessText"></div>
            <p class="guess-label" id="stepsResult"></p>
            <div class="feedback-row" id="feedbackBtns">
                <button class="btn btn-correct" onclick="markCorrect()">✓ Acertou!</button>
                <button class="btn btn-wrong"   onclick="markWrong()">✗ Errou!</button>
            </div>
            <p id="feedbackMsg"></p>
            <button class="btn btn-primary" id="registerResult" hidden onclick="recordOnChain()">Registrar resultado na Anvil</button>
            <p id="chainStatus" role="status"></p>

            <!-- Learn form: shown after wrong guess -->
            <div id="learnForm" style="display:none;width:100%;margin-top:4px;text-align:left;">
                <p id="learnQuestionLabel" style="font-size:.82rem;color:var(--muted);margin-bottom:10px;"></p>
                <div style="display:flex;flex-direction:column;gap:8px;width:100%;">
                    <input class="eth-input" type="text" id="learnCharacter" placeholder="Nome do personagem *" maxlength="60">
                    <input class="eth-input" type="text" id="learnEmoji" placeholder="Emoji do personagem (opcional, ex: ⚽)" maxlength="4" style="max-width:260px;">
                    <input class="eth-input" type="text" id="learnQuestion" placeholder="Pergunta Sim/Não diferenciadora *" maxlength="150">
                    <div style="display:flex;align-items:center;gap:14px;font-size:.85rem;color:var(--muted);padding:4px 0;flex-wrap:wrap;">
                        <span>Para o personagem correto, a resposta é:</span>
                        <label style="display:flex;align-items:center;gap:4px;cursor:pointer;color:var(--yes-color);">
                            <input type="radio" name="learnAnswer" value="yes"> Sim
                        </label>
                        <label style="display:flex;align-items:center;gap:4px;cursor:pointer;color:var(--no-color);">
                            <input type="radio" name="learnAnswer" value="no"> Não
                        </label>
                    </div>
                    <button class="btn btn-primary" onclick="submitLearn()" style="width:100%;">🧠 Ensinar o Gênio</button>
                </div>
                <p id="learnResult" style="font-size:.85rem;min-height:18px;margin-top:8px;"></p>
            </div>

            <button class="btn btn-ghost" onclick="startGame()">↩ Jogar Novamente &nbsp;<kbd class="kbd" style="font-size:.65rem;opacity:.6">Enter</kbd></button>
        </div>

        <div class="game-footer">
            <button class="footer-action" onclick="startGame()">↻ <span>Reiniciar</span></button>
            <button class="footer-action" id="historyToggle" aria-controls="historyPanel" aria-expanded="false" onclick="toggleHistory()">◷ <span>Histórico</span></button>
            <div id="scorebar">Acertos: <span id="scoreWins">0</span> de <span id="scoreTotal">0</span></div>
        </div>
    </div>

    <!-- ── Histórico ── -->
    <details id="historyPanel">
        <summary>📋 Histórico da partida</summary>
        <ul id="historyList"></ul>
    </details>

    <!-- ── Ethereum ── -->
    <details class="card" id="ethCard">
        <summary><span aria-hidden="true">◈</span> Consultar saldo Ethereum <span class="chevron" aria-hidden="true">⌄</span></summary>
        <div class="eth-content">
        <div class="eth-row">
            <input class="eth-input" type="text" id="ethAddress" placeholder="0x... endereço Ethereum" aria-label="Endereço Ethereum">
            <button class="btn btn-eth" onclick="getBalance()">Consultar</button>
        </div>
        <p id="ethResult" role="status"></p>
        </div>
    </details>

</main>

<script>
    const MAX_STEPS = 12;
    let history = [];
    let currentQuestion = '';
    let currentGuessName = '';
    let wins = 0, total = 0;
    let feedbackGiven = false;

    // ── State machine ──
    function show(id) {
        document.querySelectorAll('.state').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // ── Game flow ──
    function startGame() {
        resetScoreboard();
        history = [];
        feedbackGiven = false;
        document.getElementById('btnYes').disabled = false;
        document.getElementById('btnNo').disabled = false;
        renderHistory();
        document.getElementById('historyPanel').style.display = 'none';
        document.getElementById('historyPanel').open = false;
        document.getElementById('feedbackMsg').textContent = '';
        document.getElementById('feedbackBtns').style.display = 'flex';
        document.getElementById('learnForm').style.display = 'none';
        document.querySelector('#learnForm button').disabled = false;
        document.getElementById('learnResult').textContent = '';
        document.getElementById('learnCharacter').value = '';
        document.getElementById('learnEmoji').value = '';
        document.getElementById('learnQuestion').value = '';
        document.querySelectorAll('input[name="learnAnswer"]').forEach(r => r.checked = false);

        fetch('/start_game', { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                currentQuestion = data.question;
                show('questionState');
                setQuestion(data.question, 0);
            })
            .catch(() => alert('Erro ao iniciar o jogo.'));
    }

    function setQuestion(text, steps) {
        const el = document.getElementById('questionText');
        el.classList.add('dim');

        setTimeout(() => {
            el.textContent = text;
            el.classList.remove('dim');
        }, 220);

        const pct = Math.min(5 + (steps / MAX_STEPS) * 90, 92);
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('stepLabel').textContent = `Pergunta ${steps + 1}`;
    }

    function sendAnswer(answer) {
        const btnY = document.getElementById('btnYes');
        const btnN = document.getElementById('btnNo');
        btnY.disabled = btnN.disabled = true;

        // Add to history
        history.push({ q: currentQuestion, a: answer });

        // Thinking dots
        document.getElementById('questionText').innerHTML =
            '<div class="thinking"><span></span><span></span><span></span></div>';

        fetch('/answer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ answer })
        })
        .then(r => r.json())
        .then(data => {
            if (data.question) {
                currentQuestion = data.question;
                setQuestion(data.question, data.steps);
                btnY.disabled = btnN.disabled = false;
            } else if (data.guess) {
                total++;
                updateScore();
                showGuess(data.guess, data.emoji || '🔮', data.steps);
            } else {
                alert(data.error || 'Erro inesperado.');
                btnY.disabled = btnN.disabled = false;
            }
        })
        .catch(() => {
            alert('Erro de comunicação.');
            btnY.disabled = btnN.disabled = false;
        });
    }

    function showGuess(guess, emoji, steps) {
        currentGuessName = guess;
        document.getElementById('progressFill').style.width = '100%';

        document.getElementById('guessEmoji').textContent = emoji;
        document.getElementById('guessText').textContent  = guess;
        document.getElementById('stepsResult').textContent =
            `Cheguei lá em ${steps} pergunta${steps !== 1 ? 's' : ''}!`;

        history.push({ guess });
        renderHistory();
        document.getElementById('historyPanel').style.display = 'block';
        document.getElementById('historyPanel').open = true;

        show('guessState');
    }

    function sendFeedback(correct) {
        feedbackRequest = fetch('/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ correct })
        }).then(r => r.ok).catch(() => false);
        if (scoreboardConfig && scoreboardConfig.enabled) {
            document.getElementById('registerResult').hidden = false;
        }
    }

    function markCorrect() {
        if (feedbackGiven) return;
        feedbackGiven = true;
        wins++;
        updateScore();
        sendFeedback(true);
        document.getElementById('feedbackBtns').style.display = 'none';
        document.getElementById('feedbackMsg').className = 'feedback-yes';
        document.getElementById('feedbackMsg').textContent = '🎉 O Gênio nunca erra!';
        launchConfetti();
    }

    function markWrong() {
        if (feedbackGiven) return;
        feedbackGiven = true;
        sendFeedback(false);
        document.getElementById('feedbackBtns').style.display = 'none';
        document.getElementById('feedbackMsg').className = 'feedback-no';
        document.getElementById('feedbackMsg').textContent = '😅 Ops! Me ensine — quem era o personagem?';

        document.getElementById('learnQuestionLabel').textContent =
            `Qual pergunta Sim/Não diferencia seu personagem de "${currentGuessName}"?`;
        document.getElementById('learnForm').style.display = 'block';
    }

    async function submitLearn() {
        const character = document.getElementById('learnCharacter').value.trim();
        const emoji     = document.getElementById('learnEmoji').value.trim() || '🎭';
        const question  = document.getElementById('learnQuestion').value.trim();
        const selectedAnswer = document.querySelector('input[name="learnAnswer"]:checked');
        const answer = selectedAnswer ? selectedAnswer.value : undefined;
        const result    = document.getElementById('learnResult');

        if (!character || !question || !answer) {
            result.className = 'feedback-no';
            result.textContent = 'Preencha nome, pergunta e selecione Sim ou Não.';
            return;
        }

        const btn = document.querySelector('#learnForm button');
        btn.disabled = true;
        result.textContent = '';

        try {
            const r = await fetch('/learn', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ character, emoji, question, new_char_answer: answer })
            });
            const data = await r.json();

            if (data.success) {
                document.getElementById('learnForm').style.display = 'none';
                btn.disabled = false;
                document.getElementById('feedbackMsg').className = 'feedback-yes';
                document.getElementById('feedbackMsg').textContent =
                    `🧠 Aprendi sobre ${data.character}! Da próxima vez vou adivinhar!`;
            } else {
                result.className = 'feedback-no';
                result.textContent = data.error || 'Erro ao aprender.';
                btn.disabled = false;
            }
        } catch {
            result.className = 'feedback-no';
            result.textContent = 'Erro de comunicação.';
            btn.disabled = false;
        }
    }

    function updateScore() {
        document.getElementById('scoreWins').textContent = wins;
        document.getElementById('scoreTotal').textContent = total;
    }

    function toggleHistory() {
        const panel = document.getElementById('historyPanel');
        renderHistory();
        panel.style.display = 'block';
        panel.open = !panel.open;
    }
    document.getElementById('historyPanel').addEventListener('toggle', e => {
        document.getElementById('historyToggle').setAttribute('aria-expanded', String(e.target.open));
    });

    // ── History ──
    function renderHistory() {
        const list = document.getElementById('historyList');
        list.replaceChildren();
        history.forEach(h => {
            const item = document.createElement('li');
            if (h.guess) {
                item.className = 'hist-guess';
                item.textContent = '🎯 ' + h.guess;
            } else {
                const question = document.createElement('span');
                question.textContent = h.q;
                const badge = document.createElement('span');
                badge.className = 'hist-badge ' + (h.a === 'yes' ? 'hist-yes' : 'hist-no');
                badge.textContent = h.a === 'yes' ? 'Sim' : 'Não';
                item.append(question, badge);
            }
            list.appendChild(item);
        });
    }

    // ── Confetti ──
    function launchConfetti() {
        const colors = ['#ff2ec4','#eaff00','#00f0ff','#00ff9c','#0891b2','#ff2965','#fff'];
        for (let i = 0; i < 70; i++) {
            setTimeout(() => {
                const el = document.createElement('div');
                el.className = 'confetti-piece';
                const size = 6 + Math.random() * 10;
                el.style.cssText = [
                    `left:${Math.random() * 100}vw`,
                    `background:${colors[Math.floor(Math.random() * colors.length)]}`,
                    `width:${size}px`,
                    `height:${size}px`,
                    `animation-duration:${1.2 + Math.random() * 1.2}s`,
                    `animation-delay:${Math.random() * 0.4}s`,
                    `border-radius:${Math.random() > .5 ? '50%' : '2px'}`
                ].join(';');
                document.body.appendChild(el);
                el.addEventListener('animationend', () => el.remove());
            }, i * 25);
        }
    }

    // ── Keyboard shortcuts ──
    document.addEventListener('keydown', e => {
        if (['INPUT', 'TEXTAREA', 'BUTTON', 'SUMMARY', 'A'].includes(e.target.tagName) || e.repeat) return;
        const key = e.key.toLowerCase();

        const idle     = document.getElementById('idleState').classList.contains('active');
        const question = document.getElementById('questionState').classList.contains('active');
        const guess    = document.getElementById('guessState').classList.contains('active');

        if ((idle || guess) && e.key === 'Enter') { startGame(); return; }

        if (question && !document.getElementById('btnYes').disabled) {
            if (key === 's' || key === 'y') sendAnswer('yes');
            if (key === 'n')                sendAnswer('no');
        }
    });

    // ── ETH balance ──
    function getBalance() {
        const address = document.getElementById('ethAddress').value.trim();
        const result  = document.getElementById('ethResult');
        result.className = '';
        result.textContent = 'Consultando...';

        fetch('/eth_balance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ address })
        })
        .then(r => r.json())
        .then(data => {
            if (data.balance !== undefined) {
                result.textContent = `Saldo: ${parseFloat(data.balance).toFixed(6)} ETH`;
                result.className = 'ok';
            } else {
                result.textContent = data.error || 'Erro desconhecido';
                result.className = 'err';
            }
        })
        .catch(() => { result.textContent = 'Erro de comunicação.'; result.className = 'err'; });
    }
</script>
<script src="{{ url_for('static', filename='scoreboard.js') }}"></script>
</body>
